name: Rust

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# cancel jobs when new commit is pushed
# continue job run from pr to main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      # matches the dev shell's DATABASE_URL (postgres@127.0.0.1:5432/my_dev_db, no password)
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: my_dev_db
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v16
        with:
          name: eko-network
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - uses: Swatinem/rust-cache@v2
      # every step runs in the dev shell, so the toolchain, sqlx-cli and env
      # come from flake.lock exactly as they do locally
      - name: Check formatting
        run: nix develop --impure -c cargo fmt -- --check
      - name: Clippy
        run: SQLX_OFFLINE=true nix develop --impure -c cargo clippy -- -D warnings
      - name: Run migrations
        run: nix develop --impure -c sqlx migrate run --source eko/migrations
      - name: Test
        run: nix develop --impure -c cargo test
